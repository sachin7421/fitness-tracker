<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<meta http-equiv="refresh" content="0; url=https://sachin7421.github.io/gymiq/" />
<link rel="canonical" href="https://sachin7421.github.io/gymiq/" />
<title>GymIQ — moved</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #f0f0eb; font-family: system-ui, sans-serif; min-height: 100vh; }
  .wrap { display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: 1px; }
  p { font-size: 14px; color: #c8c8c0; line-height: 1.6; max-width: 360px; margin: 0 auto 16px; }
  a { color: #c8f135; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
</style>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  }
  setTimeout(() => { window.location.replace('https://sachin7421.github.io/gymiq/'); }, 50);
</script>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>GymIQ has moved</h1>
      <p>You're being redirected to the new home. If nothing happens, tap below.</p>
      <a href="https://sachin7421.github.io/gymiq/">→ sachin7421.github.io/gymiq/</a>
    </div>
  </div>
</body>
</html>
